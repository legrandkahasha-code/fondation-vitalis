services:
  # -------------------------------------------------------------
  # 1. BACKEND API (NestJS Web Service)
  # -------------------------------------------------------------
  - type: web
    name: cfpvitalis
    runtime: node
    plan: free
    region: frankfurt
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npm run start:prod
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        fromDatabase:
          name: cfpvitalis-db
          property: connectionString
      - key: DIRECT_URL
        fromDatabase:
          name: cfpvitalis-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: "https://vitalis-center.onrender.com,https://www.vitalis-center.onrender.com"
      - key: SWAGGER_ENABLED
        value: "false"
      - key: STORAGE_MODE
        value: local

  # -------------------------------------------------------------
  # 2. FRONTEND (Angular SPA Static Site)
  # -------------------------------------------------------------
  - type: static
    name: cfpvitalis-frontend
    region: frankfurt
    rootDir: frontend
    buildCommand: npm install && npm run build
    publishDir: dist/frontend/browser
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

# ---------------------------------------------------------------
# 3. BASE DE DONNÉES POSTGRESQL MANAGÉE
# ---------------------------------------------------------------
databases:
  - name: cfpvitalis-db
    plan: free
    region: frankfurt
    databaseName: vitalis_center
    user: vitalis
